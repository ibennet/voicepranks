[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minion-voice"
version = "0.1.0"
description = "Real-time Minion-style voice changer microphone filter"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "sounddevice",
]

[tool.setuptools.packages.find]
include = ["minion_voice*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
